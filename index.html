<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMS Grabroom Terminal</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg-main: #140a0c;
      --panel-bg: #1c0e11;
      --card-bg: #231216;
      --card-active: #2c161b;
      --border: #361b21;
      --accent: #c49756;
      --accent-hover: #d8aa68;
      --text: #ecdcd9;
      --muted: #8a7376;
      --green: #22c55e;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    /* LEFT SIDEBAR */
    .sidebar { width: 320px; border-right: 1px solid var(--border); background: var(--panel-bg); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h2 { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
    .live-tag { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

    #ticket-list { list-style: none; overflow-y: auto; padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .ticket-card { display: flex; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: 0.2s; overflow: hidden; position: relative; }
    .ticket-card:hover { border-color: var(--accent); }
    .ticket-card.active { border-color: var(--accent); background: var(--card-active); }
    .ticket-main { padding: 12px; flex: 1; }
    .t-meta { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .t-title { font-size: 13px; font-weight: bold; color: #fff; margin-bottom: 4px; }
    .t-sub { font-size: 10px; color: var(--muted); }
    .ticket-seat-badge { width: 64px; border-left: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: var(--accent); background: rgba(0,0,0,0.15); }

    /* MAIN CONTENT */
    .workspace { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px; }
    .console { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; }

    .target-card { width: 100%; display: flex; background: var(--card-bg); border: 1px dashed var(--border); border-radius: 8px; margin-bottom: 24px; min-height: 90px; }
    .target-card.empty { justify-content: center; align-items: center; color: var(--muted); font-size: 12px; border-style: dashed; }
    .target-main { padding: 16px; flex: 1; }
    .target-seat { width: 90px; border-left: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; color: var(--accent); }

    .form-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .field label { display: block; font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .field input { width: 100%; background: var(--card-bg); border: 1px solid var(--border); padding: 10px 12px; border-radius: 6px; color: #fff; font-size: 12px; outline: none; }
    .field input:focus { border-color: var(--accent); }

    .btn-pay { width: 100%; background: var(--accent); color: #140a0c; font-weight: 800; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; padding: 14px; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .btn-pay:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-pay:disabled { opacity: 0.3; cursor: not-allowed; }

    .qr-box { margin-top: 24px; display: none; flex-direction: column; align-items: center; }
    .qr-box img { width: 220px; height: 220px; background: #fff; padding: 10px; border-radius: 6px; }
    .qr-note { font-size: 11px; color: var(--muted); margin-top: 10px; }
    .status-alert { font-size: 11px; color: var(--accent); margin-top: 12px; min-height: 16px; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Available Seats</h2>
      <div class="live-tag">
        <span class="dot"></span>
        <span id="conn-state">LIVE</span>
      </div>
    </div>
    <ul id="ticket-list">
      <li style="padding: 20px; text-align: center; color: var(--muted); font-size: 11px;">Scanning for snipes...</li>
    </ul>
  </aside>

  <main class="workspace">
    <div class="console">
      
      <div id="target-display" class="target-card empty">
        Select a seat from the left to begin
      </div>

      <div class="form-grid">
        <div class="field">
          <label>Phone Number</label>
          <input type="tel" id="user-phone" placeholder="10-digit number" />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="user-email" placeholder="you@example.com" />
        </div>
      </div>

      <button id="btn-qr" class="btn-pay" disabled>Get payment QR</button>
      <div id="status-alert" class="status-alert"></div>

      <div id="qr-box" class="qr-box">
        <img id="qr-img" alt="UPI Payment QR Code" />
        <p class="qr-note">Scan with any UPI app to lock this seat</p>
      </div>

    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://edqxafyqqkhxuipzcjcd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkcXhhZnlxcWtoeHVpcHpjamNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTYzNzIsImV4cCI6MjEwMjg3MjM3Mn0.dAerrc1sTh8CSnY6vZ4NtuvPXWNwjsHCl9gWZ436MLk';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ticketList = document.getElementById('ticket-list');
    const targetDisplay = document.getElementById('target-display');
    const btnQr = document.getElementById('btn-qr');
    const inputPhone = document.getElementById('user-phone');
    const inputEmail = document.getElementById('user-email');
    const qrBox = document.getElementById('qr-box');
    const qrImg = document.getElementById('qr-img');
    const statusAlert = document.getElementById('status-alert');

    let currentTicket = null;
    let localClaims = JSON.parse(localStorage.getItem('snipe_claims') || '{}');

    // Restore saved credentials
    inputPhone.value = localStorage.getItem('snipe_phone') || '';
    inputEmail.value = localStorage.getItem('snipe_email') || '';

    inputPhone.addEventListener('input', e => localStorage.setItem('snipe_phone', e.target.value.trim()));
    inputEmail.addEventListener('input', e => localStorage.setItem('snipe_email', e.target.value.trim()));

    function addCard(ticket, prepend = false) {
      const existing = document.querySelector(`.ticket-card[data-tid="${ticket.transaction_id}"]`);
      if (existing) return;

      const firstEmpty = ticketList.querySelector('li');
      if (firstEmpty && !firstEmpty.classList.contains('ticket-card')) firstEmpty.remove();

      const card = document.createElement('li');
      card.className = 'ticket-card';
      card.setAttribute('data-tid', ticket.transaction_id);

      card.innerHTML = `
        <div class="ticket-main">
          <div class="t-meta">
            <span>${ticket.attributes || 'DOLBY CINEMA'}</span>
            <span>${ticket.show_date_code} • ${ticket.show_time}</span>
          </div>
          <div class="t-title">${ticket.event_title || 'Reserved Movie'}</div>
          <div class="t-sub">${ticket.event_language || ''} • ${ticket.event_dimension || '2D'}</div>
        </div>
        <div class="ticket-seat-badge">${ticket.seat}</div>
      `;

      card.onclick = () => {
        document.querySelectorAll('.ticket-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectTicket(ticket);
      };

      if (prepend) ticketList.prepend(card);
      else ticketList.appendChild(card);
    }

    function selectTicket(ticket) {
      currentTicket = ticket;
      targetDisplay.className = 'target-card';
      targetDisplay.innerHTML = `
        <div class="target-main">
          <div class="t-meta">
            <span>${ticket.attributes || 'DOLBY CINEMA'}</span>
            <span>${ticket.show_date_code} • ${ticket.show_time}</span>
          </div>
          <div class="t-title" style="font-size:16px;">${ticket.event_title || 'Reserved Movie'}</div>
          <div class="t-sub">${ticket.event_language || ''} • ${ticket.event_dimension || '2D'}</div>
        </div>
        <div class="target-seat">${ticket.seat}</div>
      `;

      btnQr.disabled = false;

      if (localClaims[ticket.transaction_id]) {
        showQR(localClaims[ticket.transaction_id].qrUrl);
      } else {
        qrBox.style.display = 'none';
        statusAlert.innerText = '';
      }
    }

    function showQR(url) {
      qrImg.src = url;
      qrBox.style.display = 'flex';
      statusAlert.innerText = 'Seat claimed. QR image valid for 5 minutes.';
      btnQr.disabled = true;
    }

    btnQr.onclick = () => {
      if (!currentTicket) return;
      const tid = currentTicket.transaction_id;

      if (currentTicket.upi_qr_image) {
        localClaims[tid] = { qrUrl: currentTicket.upi_qr_image, claimedAt: Date.now() };
        localStorage.setItem('snipe_claims', JSON.stringify(localClaims));
        supabase.from('tickets').update({ status: 'CLAIMED' }).eq('transaction_id', tid).then();
        showQR(currentTicket.upi_qr_image);
      } else {
        const p = inputPhone.value.trim();
        const e = inputEmail.value.trim();
        window.open(`https://in.bookmyshow.com/checkout?transId=${tid}&phone=${p}&email=${e}`, '_blank');
      }
    };

    async function init() {
      const fiveMinsAgo = Date.now() - (5 * 60 * 1000);
      const { data: tickets } = await supabase
        .from('tickets')
        .select('*')
        .gte('snipe_timestamp', fiveMinsAgo)
        .order('snipe_timestamp', { ascending: false });

      if (tickets) {
        tickets.forEach(t => {
          if (t.status === 'AVAILABLE') addCard(t, false);
        });
      }

      supabase.channel('dashboard-feed')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, payload => {
          if (payload.eventType === 'INSERT' && payload.new.status === 'AVAILABLE') {
            addCard(payload.new, true);
          } else if (payload.eventType === 'UPDATE' && payload.new.status === 'CLAIMED') {
            const tid = payload.new.transaction_id;
            if (!localClaims[tid]) {
              const el = document.querySelector(`.ticket-card[data-tid="${tid}"]`);
              if (el) el.remove();
              if (currentTicket && currentTicket.transaction_id === tid) {
                targetDisplay.className = 'target-card empty';
                targetDisplay.innerText = 'This seat expired — pick another.';
                btnQr.disabled = true;
                qrBox.style.display = 'none';
              }
            }
          }
        })
        .subscribe();
    }

    init();
  </script>
</body>
</html>

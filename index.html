<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMS Grabroom Live Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
  <style>
    @keyframes pulse-card {
      0%, 100% { border-color: rgba(239, 68, 68, 0.4); }
      50% { border-color: rgba(239, 68, 68, 1); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
    }
    .new-arrival { animation: pulse-card 1.5s infinite; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased selection:bg-red-600 selection:text-white">

  <!-- TOP HEADER -->
  <header class="border-b border-gray-800 bg-gray-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="h-3 w-3 rounded-full bg-red-600 animate-ping"></div>
        <h1 class="text-xl font-black tracking-wider uppercase">BMS Grabroom <span class="text-xs bg-red-600/20 text-red-400 border border-red-500/30 px-2 py-0.5 rounded ml-2">Live</span></h1>
      </div>
      <div id="connection-status" class="text-xs font-mono px-3 py-1 rounded bg-yellow-500/10 text-yellow-400 border border-yellow-500/20">
        Connecting to Supabase...
      </div>
    </div>
  </header>

  <!-- MAIN DASHBOARD -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-gray-900/80 border border-gray-800 rounded-xl p-4">
        <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Active Holds</p>
        <p id="stat-active" class="text-2xl font-black text-white mt-1">0</p>
      </div>
      <div class="bg-gray-900/80 border border-gray-800 rounded-xl p-4">
        <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Total Sniped</p>
        <p id="stat-total" class="text-2xl font-black text-red-500 mt-1">0</p>
      </div>
      <div class="bg-gray-900/80 border border-gray-800 rounded-xl p-4">
        <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Target Venue</p>
        <p class="text-2xl font-black text-gray-200 mt-1">ALUC</p>
      </div>
    </div>

    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold tracking-wide">Live Reservations</h2>
      <span class="text-xs text-gray-500 font-mono">Hold Window: ~8-10 Minutes</span>
    </div>

    <div id="tickets-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div id="empty-state" class="col-span-full py-20 text-center border-2 border-dashed border-gray-800 rounded-2xl bg-gray-900/20">
        <div class="text-4xl mb-3">🎯</div>
        <p class="text-gray-400 font-medium">Waiting for sniper to lock seats...</p>
        <p class="text-xs text-gray-600 mt-1 font-mono">When a ticket is locked, ntfy will ping your phone to open this room.</p>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://capwxcexfrrerttbwdut.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhcHd4Y2V4ZnJyZXJ0dGJ3ZHV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDE4OTksImV4cCI6MjEwMzkxNzg5OX0.aTZpr1nBPjcdeG85fE3uspOR6-md9YeZc-CAtvvCJLA";

    // Avoid identifier conflict by naming client instance sbClient
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ticketsGrid = document.getElementById('tickets-grid');
    const emptyState = document.getElementById('empty-state');
    const statActive = document.getElementById('stat-active');
    const statTotal = document.getElementById('stat-total');
    const statusBadge = document.getElementById('connection-status');

    let totalCount = 0;
    let activeCount = 0;

    function createTicketCard(ticket) {
      const lockTimeMs = ticket.snipe_timestamp || Date.now();
      const holdDurationSec = 8 * 60;

      const card = document.createElement('div');
      card.id = `ticket-${ticket.id}`;
      card.className = "bg-gray-900 border border-gray-800 rounded-xl p-5 flex flex-col justify-between new-arrival shadow-2xl relative overflow-hidden transition-all duration-300";

      const checkoutUrl = `https://in.bookmyshow.com/checkout?transId=${ticket.transaction_id}`;

      card.innerHTML = `
        <div class="flex items-start justify-between">
          <div>
            <span class="text-xs font-mono font-bold uppercase tracking-wider text-red-400 bg-red-950/60 border border-red-800/40 px-2 py-0.5 rounded">
              ${ticket.attributes || 'DOLBY CINEMA'}
            </span>
            <h3 class="text-2xl font-black text-white mt-2">${ticket.seat}</h3>
            <p class="text-sm text-gray-300 font-semibold">${ticket.event_title || 'Movie Title'}</p>
          </div>
          <div class="text-right">
            <span id="timer-${ticket.id}" class="text-xs font-mono font-bold text-yellow-400 bg-yellow-950/40 border border-yellow-800/30 px-2 py-1 rounded block">
              08:00
            </span>
            <span class="text-[10px] text-gray-500 font-mono mt-1 block">TRANS: ${String(ticket.transaction_id).slice(-6)}</span>
          </div>
        </div>

        <div class="my-4 pt-3 border-t border-gray-800/80 grid grid-cols-2 gap-2 text-xs font-mono text-gray-400">
          <div><span class="text-gray-600">Date:</span> ${ticket.show_date_code}</div>
          <div><span class="text-gray-600">Time:</span> ${ticket.show_time}</div>
          <div><span class="text-gray-600">Screen:</span> ${ticket.screen_name || 'Main'}</div>
          <div><span class="text-gray-600">BookingID:</span> ${ticket.booking_id || 'N/A'}</div>
        </div>

        <a href="${checkoutUrl}" target="_blank" rel="noopener noreferrer" 
           class="w-full text-center bg-red-600 hover:bg-red-500 active:bg-red-700 text-white font-bold py-3 px-4 rounded-lg tracking-wider uppercase transition shadow-lg shadow-red-900/30 flex items-center justify-center space-x-2">
          <span>⚡ GRAB & PAY</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </a>
      `;

      const timerElem = card.querySelector(`#timer-${ticket.id}`);
      const timerInterval = setInterval(() => {
        const elapsedSec = Math.floor((Date.now() - lockTimeMs) / 1000);
        const remainingSec = holdDurationSec - elapsedSec;

        if (remainingSec <= 0) {
          clearInterval(timerInterval);
          timerElem.innerText = "EXPIRED";
          timerElem.className = "text-xs font-mono font-bold text-red-500 bg-red-950/60 border border-red-800/50 px-2 py-1 rounded block";
          card.classList.remove('new-arrival');
          card.classList.add('opacity-40');
          activeCount = Math.max(0, activeCount - 1);
          statActive.innerText = activeCount;
        } else {
          const mins = String(Math.floor(remainingSec / 60)).padStart(2, '0');
          const secs = String(remainingSec % 60).padStart(2, '0');
          timerElem.innerText = `${mins}:${secs}`;
        }
      }, 1000);

      return card;
    }

    function addTicketToUI(ticket) {
      if (emptyState && emptyState.parentNode) emptyState.remove();

      const existingCard = document.getElementById(`ticket-${ticket.id}`);
      if (existingCard) return;

      const card = createTicketCard(ticket);
      ticketsGrid.prepend(card);

      totalCount++;
      activeCount++;
      statTotal.innerText = totalCount;
      statActive.innerText = activeCount;
    }

    async function loadInitialTickets() {
      try {
        const { data, error } = await sbClient
          .from('tickets')
          .select('*')
          .order('id', { ascending: false })
          .limit(12);

        if (error) {
          console.error("Fetch Error:", error);
          statusBadge.innerText = "Fetch Error (Check RLS)";
          statusBadge.className = "text-xs font-mono px-3 py-1 rounded bg-red-500/10 text-red-400 border border-red-500/20";
          return;
        }

        if (data && data.length > 0) {
          data.reverse().forEach(ticket => addTicketToUI(ticket));
        }

        statusBadge.innerText = "● Connected";
        statusBadge.className = "text-xs font-mono px-3 py-1 rounded bg-green-500/10 text-green-400 border border-green-500/20";
      } catch (err) {
        console.error("Init Error:", err);
      }
    }

    function initRealtimeListener() {
      sbClient
        .channel('tickets-feed')
        .on(
          'postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'tickets' },
          (payload) => {
            console.log("🔥 New Lock Event:", payload.new);
            addTicketToUI(payload.new);
          }
        )
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            statusBadge.innerText = "● Live WebSocket Active";
            statusBadge.className = "text-xs font-mono px-3 py-1 rounded bg-green-500/10 text-green-400 border border-green-500/20";
          }
        });
    }

    loadInitialTickets();
    initRealtimeListener();
  </script>
</body>
</html>

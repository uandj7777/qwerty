<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMS Available Seats Live Terminal</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg: #11090a;
      --card-bg: #1c0e12;
      --card-active: #241116;
      --border: #381a20;
      --border-active: #bf8d4f;
      --accent: #bf8d4f;
      --accent-hover: #d19d59;
      --text: #e0d0cf;
      --muted: #856a6d;
      --green: #22c55e;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    /* SIDEBAR */
    .sidebar { width: 320px; border-right: 1px solid var(--border); background: var(--bg); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h2 { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
    .live-indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: 1.5px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

    #ticket-list { list-style: none; overflow-y: auto; padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    
    .ticket-card {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    .ticket-card:hover { border-color: var(--accent); }
    .ticket-card.active { border-color: var(--border-active); background: var(--card-active); box-shadow: 0 0 10px rgba(191, 141, 79, 0.15); }
    
    .ticket-main { padding: 12px 14px; flex: 1; }
    .t-meta { font-size: 8.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .t-title { font-size: 13px; font-weight: 800; color: #fff; margin-bottom: 4px; letter-spacing: 0.5px; }
    .t-sub { font-size: 9.5px; color: var(--muted); }
    
    .ticket-stub {
      width: 70px;
      border-left: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      color: var(--accent);
      background: rgba(0,0,0,0.2);
    }

    /* RIGHT WORKSPACE CONSOLE */
    .workspace { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px; overflow-y: auto; }
    .console { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; }

    .target-card {
      width: 100%;
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 24px;
      min-height: 90px;
      position: relative;
    }
    .target-card.empty {
      justify-content: center;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      border: 1px dashed var(--border);
      background: transparent;
    }
    .target-main { padding: 16px 20px; flex: 1; }
    .target-seat {
      width: 95px;
      border-left: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: var(--accent);
      background: rgba(0,0,0,0.2);
    }

    .form-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .field label { display: block; font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .field input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      outline: none;
      font-family: inherit;
    }
    .field input:focus { border-color: var(--accent); }
    .field input:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-pay {
      width: 100%;
      background: var(--accent);
      color: #11090a;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-pay:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-pay:disabled { opacity: 0.3; cursor: not-allowed; }

    .status-alert { font-size: 11px; color: var(--accent); margin-top: 14px; text-align: center; min-height: 18px; }

    .qr-box { margin-top: 20px; display: none; flex-direction: column; align-items: center; }
    .qr-box img { width: 230px; height: 230px; background: #fff; padding: 12px; border-radius: 6px; }
    .qr-note { font-size: 11px; color: var(--muted); margin-top: 14px; text-align: center; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Available Seats</h2>
      <div class="live-indicator">
        <span class="dot"></span>
        <span id="conn-state">CONNECTING</span>
      </div>
    </div>
    <ul id="ticket-list">
      <li style="padding: 30px; text-align: center; color: var(--muted); font-size: 11px;">Scanning for reservations...</li>
    </ul>
  </aside>

  <main class="workspace">
    <div class="console">
      
      <div id="target-display" class="target-card empty">
        Select a seat from the left to begin
      </div>

      <div class="form-grid">
        <div class="field">
          <label>Phone Number</label>
          <input type="tel" id="user-phone" placeholder="10-digit number" autocomplete="off" disabled />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="user-email" placeholder="you@example.com" autocomplete="off" disabled />
        </div>
      </div>

      <button id="btn-qr" class="btn-pay" disabled>Get payment QR</button>
      <div id="status-alert" class="status-alert"></div>

      <div id="qr-box" class="qr-box">
        <img id="qr-result" alt="UPI Payment QR Code" />
        <p class="qr-note">Scan with any UPI app to complete booking</p>
      </div>

    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://capwxcexfrrerttbwdut.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhcHd4Y2V4ZnJyZXJ0dGJ3ZHV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDE4OTksImV4cCI6MjEwMzkxNzg5OX0.aTZpr1nBPjcdeG85fE3uspOR6-md9YeZc-CAtvvCJLA";

    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ticketList = document.getElementById('ticket-list');
    const targetDisplay = document.getElementById('target-display');
    const btnQr = document.getElementById('btn-qr');
    const inputPhone = document.getElementById('user-phone');
    const inputEmail = document.getElementById('user-email');
    const qrBox = document.getElementById('qr-box');
    const qrResult = document.getElementById('qr-result');
    const statusAlert = document.getElementById('status-alert');

    let currentTicket = null;
    let localClaims = JSON.parse(localStorage.getItem('snipe_claims') || '{}');

    inputPhone.value = localStorage.getItem('snipe_phone') || '';
    inputEmail.value = localStorage.getItem('snipe_email') || '';

    inputPhone.addEventListener('input', e => localStorage.setItem('snipe_phone', e.target.value.trim()));
    inputEmail.addEventListener('input', e => localStorage.setItem('snipe_email', e.target.value.trim()));

    function addCard(ticket, prepend = false) {
      const existing = document.querySelector(`.ticket-card[data-tid="${ticket.transaction_id}"]`);
      if (existing) return;

      const firstEmpty = ticketList.querySelector('li');
      if (firstEmpty && !firstEmpty.classList.contains('ticket-card')) firstEmpty.remove();

      const card = document.createElement('li');
      card.className = 'ticket-card';
      card.setAttribute('data-tid', ticket.transaction_id);

      card.innerHTML = `
        <div class="ticket-main">
          <div class="t-meta">
            <span>${ticket.attributes || 'DOLBY CINEMA'}</span>
            <span>${ticket.show_date_code || ''} • ${ticket.show_time || ''}</span>
          </div>
          <div class="t-title">${ticket.event_title || 'Movie'}</div>
          <div class="t-sub">${ticket.event_language || ''} • ${ticket.attributes || 'DOLBY CINEMA 2D'}</div>
        </div>
        <div class="ticket-stub">${ticket.seat}</div>
      `;

      card.onclick = () => {
        document.querySelectorAll('.ticket-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectTicket(ticket);
      };

      if (prepend) ticketList.prepend(card);
      else ticketList.appendChild(card);
    }

    function selectTicket(ticket) {
      currentTicket = ticket;
      targetDisplay.className = 'target-card';
      targetDisplay.innerHTML = `
        <div class="target-main">
          <div class="t-meta">
            <span>${ticket.attributes || 'DOLBY CINEMA'}</span>
            <span>${ticket.show_date_code || ''} • ${ticket.show_time || ''}</span>
          </div>
          <div class="t-title" style="font-size:15px;">${ticket.event_title || 'Movie'}</div>
          <div class="t-sub">${ticket.event_language || ''} • ${ticket.attributes || 'DOLBY CINEMA 2D'}</div>
        </div>
        <div class="target-seat">${ticket.seat}</div>
      `;

      inputPhone.disabled = false;
      inputEmail.disabled = false;
      btnQr.disabled = false;

      if (localClaims[ticket.transaction_id]) {
        showQR(localClaims[ticket.transaction_id].qrUrl);
      } else if (ticket.status === 'QR_READY' && ticket.upi_qr_image) {
        showQR(ticket.upi_qr_image);
      } else if (ticket.status === 'PROCESSING' || ticket.status === 'GENERATE_QR') {
        qrBox.style.display = 'none';
        statusAlert.innerText = 'Binding details and requesting QR from runner...';
        statusAlert.style.color = 'var(--accent)';
        btnQr.disabled = true;
      } else {
        qrBox.style.display = 'none';
        statusAlert.innerText = '';
      }
    }

    function showQR(url) {
      qrResult.src = url;
      qrBox.style.display = 'flex';
      statusAlert.innerText = 'Official UPI Barcode ready. Valid for 5 minutes.';
      statusAlert.style.color = 'var(--green)';
      btnQr.disabled = true;
      inputPhone.disabled = true;
      inputEmail.disabled = true;
    }

    // DISPATCH SETPAYMENT VIA RUNNER
    btnQr.onclick = async () => {
      if (!currentTicket) return;

      const phone = inputPhone.value.trim();
      const email = inputEmail.value.trim();

      if (!phone || phone.length < 10) {
        statusAlert.innerText = "Please enter a valid 10-digit phone number.";
        statusAlert.style.color = "var(--red)";
        return;
      }
      if (!email || !email.includes('@')) {
        statusAlert.innerText = "Please enter a valid email address.";
        statusAlert.style.color = "var(--red)";
        return;
      }

      btnQr.disabled = true;
      inputPhone.disabled = true;
      inputEmail.disabled = true;
      statusAlert.innerText = "Forwarding to runner to bind account and generate QR...";
      statusAlert.style.color = "var(--accent)";

      const tid = currentTicket.transaction_id;

      const { error } = await sbClient.from('tickets').update({
        status: 'GENERATE_QR',
        user_phone: phone,
        user_email: email
      }).eq('transaction_id', tid);

      if (error) {
        statusAlert.innerText = `Database update error: ${error.message}`;
        statusAlert.style.color = "var(--red)";
        btnQr.disabled = false;
        inputPhone.disabled = false;
        inputEmail.disabled = false;
      }
    };

    async function init() {
      const { data: tickets, error } = await sbClient
        .from('tickets')
        .select('*')
        .order('id', { ascending: false })
        .limit(15);

      if (error) {
        document.getElementById('conn-state').innerText = "ERROR";
        return;
      }

      document.getElementById('conn-state').innerText = "LIVE";

      if (tickets && tickets.length > 0) {
        tickets.reverse().forEach(t => {
          if (t.status === 'AVAILABLE' || t.status === 'QR_READY' || t.status === 'PROCESSING') {
            addCard(t, false);
          }
        });
        const activeCards = document.querySelectorAll('.ticket-card');
        if (activeCards.length > 0) {
          activeCards[activeCards.length - 1].click();
        }
      }

      sbClient.channel('dashboard-feed')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, payload => {
          if (payload.eventType === 'INSERT' && payload.new.status === 'AVAILABLE') {
            addCard(payload.new, true);
            selectTicket(payload.new);
          } else if (payload.eventType === 'UPDATE') {
            const updated = payload.new;
            if (updated.status === 'QR_READY' && currentTicket?.transaction_id === updated.transaction_id) {
              localClaims[updated.transaction_id] = { qrUrl: updated.upi_qr_image, claimedAt: Date.now() };
              localStorage.setItem('snipe_claims', JSON.stringify(localClaims));
              showQR(updated.upi_qr_image);
            } else if (updated.status === 'QR_FAILED' && currentTicket?.transaction_id === updated.transaction_id) {
              statusAlert.innerText = "BMS rejected payment intent for this hold. Seat expired or invalid.";
              statusAlert.style.color = "var(--red)";
              btnQr.disabled = false;
              inputPhone.disabled = false;
              inputEmail.disabled = false;
            } else if (updated.status === 'CLAIMED' && !localClaims[updated.transaction_id]) {
              const el = document.querySelector(`.ticket-card[data-tid="${updated.transaction_id}"]`);
              if (el) el.remove();
            }
          }
        })
        .subscribe();
    }

    init();
  </script>
</body>
</html>
